services:
  api:
    build:
      context: .
      args:
        VITE_CESIUM_ION_TOKEN: "${VITE_CESIUM_ION_TOKEN:-}"
        VITE_CESIUM_ENABLE_OSM_BUILDINGS: "${VITE_CESIUM_ENABLE_OSM_BUILDINGS:-true}"
        VITE_CESIUM_ENABLE_PHOTOREALISTIC: "${VITE_CESIUM_ENABLE_PHOTOREALISTIC:-true}"
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    volumes: ["./data:/app/data"]
    profiles: ["local", "dgx"]

  worker-0:
    build: .
    entrypoint: ["/bin/sh", "-lc"]
    command: ["ottawa-rt worker $${RUN_ID:?set RUN_ID}"]
    environment: {NVIDIA_VISIBLE_DEVICES: "0"}
    volumes: ["./data:/app/data"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, device_ids: ["0"], capabilities: [gpu]}]
    profiles: ["local"]

  worker-1:
    build: .
    entrypoint: ["/bin/sh", "-lc"]
    command: ["ottawa-rt worker $${RUN_ID:?set RUN_ID}"]
    environment: {NVIDIA_VISIBLE_DEVICES: "1"}
    volumes: ["./data:/app/data"]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, device_ids: ["1"], capabilities: [gpu]}]
    profiles: ["local"]
